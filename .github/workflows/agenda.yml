name: Agenda (flux du calendrier ZoneCours)
on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: contenu
  cancel-in-progress: false
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lire le flux et chiffrer l'agenda
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
        run: node tools/ics-agenda.mjs
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "locked-in-bot"
            git config user.email "locked-in-bot@users.noreply.github.com"
            git add data
            git commit -m "Agenda : mise à jour du flux de calendrier"
            if ! git pull --rebase --autostash; then
              node tools/fusion-index.mjs && git add data/index.json && GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi
